<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>湖東タイピング</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>湖東タイピング</h1>

    <!-- 設定・スタート画面 -->
    <div id="start-screen" class="screen active">
      <div class="setting-group">
        <label>ゲームモード:</label>
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="ta">タイムアタック</button>
          <button type="button" class="mode-btn" data-mode="cpu">CPU対戦</button>
        </div>
      </div>

      <div class="setting-group">
        <label>プレイヤー名:</label>
        <input type="text" id="player-name-input" placeholder="名前を入力してください" maxlength="15">
      </div>

      <div class="setting-group">
        <label>難易度:</label>
        <select id="level-select">
  <option value="1">レベル1（50打）</option>
  <option value="2">レベル2（100打）</option>
  <option value="3">レベル3（150打）</option>
  <option value="4">レベル4（200打）</option>
  <option value="5">レベル5（250打）</option>
  <option value="6">レベル6（300打）</option>
  <option value="7">レベル7（350打）</option>
  <option value="8">レベル8（400打）</option>
  <option value="9">レベル9（450打）</option>
  <option value="10">レベル10（500打）</option>
  <option value="11">レベル11（550打）</option>
  <option value="12">レベル12（600打）</option>
  <option value="13">レベル13（650打）</option>
  <option value="14">レベル14（700打）</option>
  <option value="15">レベル15（750打）</option>
  <option value="16">レベル16（800打）</option>
  <option value="17">レベル17（850打）</option>
  <option value="18">レベル18（900打）</option>
  <option value="19">レベル19（950打）</option>
  <option value="20">レベル20（1000打）</option>
  <option value="21">レベル21（1100打）</option>
</select>
      </div>
		
	<button id="start-btn" class="main-btn">ゲームスタート！</button>

      <!-- ランキング表示エリア -->
      <div class="ranking-section">
        <h3>🏆 難易度別トップ3 (KPM)</h3>
        <div id="ranking-list" class="ranking-list"></div>
      </div>

    </div>

    <!-- プレイ画面 -->
    <div id="play-screen" class="screen">
      <div class="status-bar">
        <div class="status-item" id="timer-status-item">残り時間: <span id="timer">30</span> 秒</div>
        <div class="status-item" id="player-score-item">あなた: <span id="score">0</span> 打</div>
      </div>

      <!-- CPU対戦モード専用 対戦メーター -->
      <div id="vs-meter-container" class="vs-meter-container">
        <div class="meter-labels">
          <span class="cpu-label">🤖 CPU</span>
          <span class="player-label">YOU 🏃</span>
        </div>
        <div class="meter-bar-bg">
          <div id="meter-bar-fill" class="meter-bar-fill"></div>
        </div>
      </div>

      <div class="word-display-area">
<div id="kanji-display" class="kanji-text">
  <ruby id="ruby-kanji">おだい<rt id="ruby-kana">おだい</rt></ruby>
</div>        <div id="roma-display" class="roma-text">
          <span id="typed-text" class="typed"></span><span id="untyped-text" class="untyped">odai</span>
        </div>
        <div class="next-word-box">
          NEXT: <span id="next-kanji-display">つぎのおだい</span>
        </div>
      </div>

      <div class="instruction">半角英数キーボードで入力してください</div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen">
      <div class="result-card" id="capture-area">
        <div class="result-header">
          <h2 id="result-title-text">タイピング対戦 結果証明書</h2>
          <img src="images/trophy.png" alt="Trophy" class="result-badge-img" onerror="this.style.display='none'">
        </div>

        <div class="player-info">
          <span>プレイヤー名:</span>
          <strong id="res-player-name">ゲスト</strong>
        </div>

        <!-- 対戦結果勝敗表示（CPUモード時のみ表示） -->
        <div class="vs-result-box" id="vs-result-box">
          <div id="res-vs-status" class="vs-status">WIN!</div>
          <div id="res-target-msg" class="target-msg">クリア目標達成！</div>
        </div>

        <div class="rank-box">
          <div class="rank-title">評価称号</div>
          <div id="res-title" class="title-display">タイピングマスター</div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">あなたの打鍵数</span>
            <span id="res-typed" class="stat-value">0 打</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">1分換算 (KPM)</span>
            <span id="res-wpm" class="stat-value">0</span>
          </div>
          <div class="stat-box" id="res-cpu-stat-box">
            <span class="stat-label">CPU打鍵数</span>
            <span id="res-cpu-typed" class="stat-value">0 打</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">正確性</span>
            <span id="res-accuracy" class="stat-value">0%</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">ミスタイプ数</span>
            <span id="res-miss" class="stat-value">0 回</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">クリア目標</span>
            <span id="res-target-count" class="stat-value">50 打</span>
          </div>
        </div>
      </div>

      <button id="retry-btn" class="main-btn">もう一度挑戦する</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
